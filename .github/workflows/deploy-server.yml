name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one deploy at a time; a newer push cancels an in-flight one.
concurrency:
  group: deploy-vps
  cancel-in-progress: true

env:
  # Where nginx serves the site from on the runner's own host.
  DEPLOY_PATH: /var/www/axios

jobs:
  deploy:
    # Runs on the self-hosted runner registered on nucleus-server itself.
    # The build and the deploy target are the same machine, on a private
    # network address a GitHub-hosted runner could never reach — so this
    # avoids SSH entirely and just copies files locally.
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_ACHRONOS_INTRO: ${{ vars.PUBLIC_ACHRONOS_INTRO || 'true' }}

      - name: Deploy build locally
        run: |
          # Sync into a staging dir first, then atomically swap it in so
          # nginx never serves a half-updated tree.
          rsync -a --delete dist/ "$DEPLOY_PATH.new/"

          rm -rf "$DEPLOY_PATH.old"
          if [ -d "$DEPLOY_PATH" ]; then
            mv "$DEPLOY_PATH" "$DEPLOY_PATH.old"
          fi
          mv "$DEPLOY_PATH.new" "$DEPLOY_PATH"
          rm -rf "$DEPLOY_PATH.old"
