name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one deploy at a time; a newer push cancels an in-flight one.
concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_ACHRONOS_INTRO: ${{ vars.PUBLIC_ACHRONOS_INTRO || 'true' }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload build to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Sync into a staging dir first, then atomically swap it in so the
          # site is never half-updated while rsync runs.
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH.new/"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "rm -rf '$DEPLOY_PATH.old' \
             && { [ -d '$DEPLOY_PATH' ] && mv '$DEPLOY_PATH' '$DEPLOY_PATH.old' || true; } \
             && mv '$DEPLOY_PATH.new' '$DEPLOY_PATH' \
             && rm -rf '$DEPLOY_PATH.old'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
