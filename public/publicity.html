<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e0b09">
<meta name="description" content="We asked ChatGPT what students want. Choose a pill.">
<title>Choose a Pill — The Answer Is Here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="/publicity-palms.webp" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:wght@700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--black:#0e0b09;--cream:#f7f1e4;--red:#e23b2e;--amber:#f0a500;--mono:"Space Mono",monospace;--display:"Anton",Impact,sans-serif;--body:"Bricolage Grotesque",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--black);color:var(--cream);font-family:var(--body)}.screen{width:100%;height:100vh;height:100dvh;overflow:hidden;display:grid;place-items:center;background:var(--black)}
.hero{width:min(100% - 34px,950px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:10px 0}h1{width:100%;margin:0;font:400 clamp(42px,11.5vw,106px)/.92 var(--display);letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}h1 span{display:block}h1 em{font-style:normal;color:var(--amber);text-shadow:3px 3px 0 var(--red)}
.palms{position:relative;align-self:center;width:min(92vw,550px);aspect-ratio:1536/624;overflow:visible;margin-top:clamp(20px,3.5vh,32px)}.palms img{position:absolute;top:0;left:0;display:block;width:100%;height:auto;max-width:none;transform:translateY(-21.875%);user-select:none;-webkit-user-drag:none;pointer-events:none}.palms .base{clip-path:inset(21.875% 0 17.1875% 0)}.palms .lift{transition:transform .18s steps(3,end),filter .18s steps(3,end)}.palms .blue-lift{clip-path:ellipse(5.3% 4.4% at 30% 52%)}.palms .red-lift{clip-path:ellipse(5.3% 4.4% at 70% 52%)}
.pill-link{position:absolute;z-index:2;top:49.4%;width:max(48px,15%);height:max(48px,26%);display:block;transform:translate(-50%,-50%);border-radius:999px;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}.pill-link.blue{left:30%}.pill-link.red{left:70%}.pill-link:after{content:attr(data-label);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(5px);padding:6px 8px;border:2px solid var(--cream);background:#17100a;color:var(--cream);box-shadow:3px 3px 0 var(--amber);white-space:nowrap;font:700 10px var(--mono);letter-spacing:.06em;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}.pill-link:hover:after,.pill-link:focus-visible:after{opacity:1;transform:translateX(-50%) translateY(0)}.pill-link:hover + .lift,.pill-link:focus-visible + .lift{transform:translateY(calc(-21.875% - 8px));filter:drop-shadow(0 5px 2px #ffffff99)}.pill-link:focus-visible{outline:3px solid var(--cream);outline-offset:5px}
/* No hover to reveal them, so the labels stay up - which makes them read as buttons. They sit
   outside the anchor's box, so without pointer-events they look tappable and do nothing. */
@media(hover:none){.pill-link:after{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}}
@media(min-width:680px){.hero{align-items:center;text-align:center}}
@media(max-width:359px){h1{font-size:39px}.hero{width:calc(100% - 28px)}.palms{width:min(88vw,310px);margin-top:14px}}
@media(max-height:610px){.hero{padding:0}h1{font-size:min(10.4vw,8.7vh,80px)}.palms{width:min(76vw,390px);margin-top:12px}}
@media(max-height:450px){h1{font-size:min(9vw,10vh,58px)}.palms{width:min(57vw,250px);margin-top:7px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;scroll-behavior:auto!important}.pill-link:hover + .lift,.pill-link:focus-visible + .lift{transform:translateY(-21.875%)}}
</style>
</head>
<body>
<main class="screen">
<section class="hero" aria-label="The answer">
 <h1><span>We asked ChatGPT</span><span>what students <em>want.</em></span></h1>
 <div class="palms">
  <img class="base" src="/publicity-palms.webp" width="1536" height="1024" alt="" aria-hidden="true" draggable="false" fetchpriority="high" decoding="async">
  <a class="pill-link blue" href="https://axios.psgtech.ac.in/" data-label="BLUE PILL ↗" aria-label="Choose the blue pill — open the event website"></a>
  <img class="lift blue-lift" src="/publicity-palms.webp" width="1536" height="1024" alt="" aria-hidden="true" draggable="false" decoding="async">
  <a class="pill-link red" href="https://axios.psgtech.ac.in/" data-label="RED PILL ↗" aria-label="Choose the red pill — open the event website"></a>
  <img class="lift red-lift" src="/publicity-palms.webp" width="1536" height="1024" alt="" aria-hidden="true" draggable="false" decoding="async">
 </div>
</section>
</main>
</body>
</html>
