# /etc/nginx/sites-available/axios
# Static Astro build. astro.config.mjs uses build.format = 'file', so routes
# are emitted as /about.html rather than /about/index.html; try_files covers both.
server {
    listen 80;
    listen [::]:80;
    server_name axios.psgtech.ac.in 10.1.67.158;

    root /var/www/axios;
    index index.html;

    # Hashed assets from Astro are safe to cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
