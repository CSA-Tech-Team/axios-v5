# /etc/nginx/sites-available/axios
#
# !! DO NOT copy this file over the live one. !!
# The live file also carries a `listen 443 ssl` server block that certbot
# added, with the Let's Encrypt paths for axios.psgtech.ac.in. Overwriting the
# live file deletes that block, and HTTPS then falls through to another site on
# this shared server. Apply changes here by hand instead, or re-run
# `sudo certbot --nginx -d axios.psgtech.ac.in` afterwards to reinstall it.
#
# Static Astro build. astro.config.mjs uses build.format = 'file', so routes
# are emitted as /about.html rather than /about/index.html; try_files covers both.
#
# This file is a reference copy. Nothing deploys it automatically — edit the
# copy on the server too, then `sudo nginx -t && sudo systemctl reload nginx`.
server {
    listen 80;
    listen [::]:80;
    server_name axios.psgtech.ac.in 10.1.67.158;

    root /var/www/axios;
    index index.html;

    # Paths from the Axios '25 site that search engines still list. Send the
    # visitor to the homepage rather than a dead end.
    location = /events { return 301 /; }
    location = /signup { return 301 /; }
    location = /app    { return 301 /; }
    location = /about  { return 301 /; }

    # Hashed assets from Astro are safe to cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Serve the build's styled 404 page, with a real 404 status so search
    # engines drop stale URLs instead of indexing them as duplicates.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
